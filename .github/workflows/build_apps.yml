name: Multi-Platform Build

on:
  workflow_dispatch:
    inputs:
      upload_android_internal:
        description: Upload the signed Android AAB to the Google Play internal track
        required: false
        default: false
        type: boolean
      deploy_web_to_cloudflare:
        description: Deploy the built web app to Cloudflare Pages
        required: false
        default: false
        type: boolean

jobs:
  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync app version to commit count
        run: ./scripts/sync_version.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define=API_URL=https://aliolo.com
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-web
          path: build/web/
      - name: Verify Build
        run: ls -R build/web
      - name: Deploy to Cloudflare Pages
        if: inputs.deploy_web_to_cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: aliolo
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: app_version
        name: Sync app version to commit count
        run: |
          app_version="$(./scripts/sync_version.sh)"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Configure Android release signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > android/app/aliolo-release-keystore.jks
            printf '%s\n' \
              'storeFile=aliolo-release-keystore.jks' \
              "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
              "keyAlias=$ANDROID_KEY_ALIAS" \
              "keyPassword=$ANDROID_KEY_PASSWORD" \
              > android/key.properties
          fi
      - run: flutter build apk --release --dart-define=API_URL=https://aliolo.com
      - run: flutter build appbundle --release --dart-define=API_URL=https://aliolo.com
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - id: google_auth
        name: Authenticate to Google Cloud
        if: ${{ github.event.inputs.upload_android_internal == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAY_UPLOAD_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Upload to Google Play internal track
        if: ${{ github.event.inputs.upload_android_internal == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.google_auth.outputs.credentials_file_path }}
          packageName: com.nanomarkup.aliolo
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: Aliolo ${{ steps.app_version.outputs.app_version }}

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync app version to commit count
        run: ./scripts/sync_version.sh
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libasound2-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=API_URL=https://aliolo.com
      - name: Create Linux Bundle (Zip)
        run: |
          cd build/linux/x64/release/bundle/
          zip -r ../../../../../aliolo-linux.zip .
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-linux
          path: aliolo-linux.zip

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync app version to commit count
        shell: bash
        run: ./scripts/sync_version.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=API_URL=https://aliolo.com
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-windows
          path: build\windows\x64\runner\Release\

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync app version to commit count
        run: ./scripts/sync_version.sh
      - name: Select Xcode 26.1.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=API_URL=https://aliolo.com
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-macos
          path: build/macos/Build/Products/Release/

  build_ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync app version to commit count
        run: ./scripts/sync_version.sh
      - name: Select Xcode 26.1.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=https://aliolo.com
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-ios
          path: build/ios/iphoneos/
