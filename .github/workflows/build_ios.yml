name: Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync app version to commit count
        run: ./scripts/sync_version.sh
      - name: Select Xcode 26.1.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=https://aliolo.com
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-ios
          path: build/ios/iphoneos/
