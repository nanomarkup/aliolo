name: Build Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync app version to commit count
        run: ./scripts/sync_version.sh
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libasound2-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=API_URL=https://aliolo.com
      - name: Create Linux Bundle (Zip)
        run: |
          cd build/linux/x64/release/bundle/
          zip -r ../../../../../aliolo-linux.zip .
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-linux
          path: aliolo-linux.zip
