name: Build Android

on:
  workflow_dispatch:
    inputs:
      upload_android_internal:
        description: Upload the signed Android AAB to the Google Play internal track
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: app_version
        name: Sync app version to commit count
        run: |
          app_version="$(./scripts/sync_version.sh)"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Configure Android release signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/aliolo-release-keystore.jks
            printf "storeFile=aliolo-release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
            ls -l android/key.properties android/app/aliolo-release-keystore.jks
          fi
      - name: Verify Keystore Integrity
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f android/app/aliolo-release-keystore.jks ]; then
            keytool -list -v \
              -keystore android/app/aliolo-release-keystore.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keypass "$ANDROID_KEY_PASSWORD" | grep "Alias name" || echo "Keystore verification FAILED"
          fi
      - run: flutter build apk --release --dart-define=API_URL=https://aliolo.com
      - run: flutter build appbundle --release --dart-define=API_URL=https://aliolo.com
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aliolo-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - id: google_auth
        name: Authenticate to Google Cloud
        if: ${{ github.event.inputs.upload_android_internal == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_PATH }}
          service_account: ${{ secrets.GCP_PLAY_UPLOAD_SERVICE_ACCOUNT }}
          project_id: 'dulcet-clock-494800-i8'
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up Cloud SDK
        if: ${{ github.event.inputs.upload_android_internal == 'true' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Upload to Google Play internal track
        if: ${{ github.event.inputs.upload_android_internal == 'true' }}
        uses: r0adkll/upload-google-play@v1
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google_auth.outputs.credentials_file_path }}
        with:
          serviceAccountJson: ${{ steps.google_auth.outputs.credentials_file_path }}
          packageName: com.nanomarkup.aliolo
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: Aliolo ${{ steps.app_version.outputs.app_version }} (Build ${{ github.run_number }})
          releaseNotes: |
            Build: ${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
